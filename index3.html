<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>امتحانات الدفعة - كلية الطب جامعة قنا الأهلية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface2: #1a1a26;
      --surface3: #22223a;
      --border: rgba(255,255,255,0.08);
      --border-hover: rgba(0,230,118,0.4);
      --green: #00e676;
      --green-dim: #00c853;
      --green-glow: rgba(0,230,118,0.15);
      --red: #ff5252;
      --amber: #ffab40;
      --text: #e8e8f0;
      --text-dim: #7a7a9a;
      --text-muted: #4a4a6a;
      --nav-h: 64px;
      --radius: 16px;
      --radius-sm: 10px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
      --shadow-green: 0 0 40px rgba(0,230,118,0.12);
    }

    [data-theme="light"] {
      --bg: #f0f2f7;
      --surface: #ffffff;
      --surface2: #f5f6fa;
      --surface3: #eaecf4;
      --border: rgba(0,0,0,0.08);
      --border-hover: rgba(0,180,80,0.4);
      --green: #00a651;
      --green-dim: #008f45;
      --green-glow: rgba(0,166,81,0.12);
      --red: #e53935;
      --amber: #f57c00;
      --text: #1a1a2e;
      --text-dim: #555577;
      --text-muted: #9999bb;
      --shadow: 0 8px 32px rgba(0,0,0,0.1);
      --shadow-green: 0 0 40px rgba(0,166,81,0.1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Cairo', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      direction: rtl;
      transition: background 0.35s ease, color 0.35s ease;
      overflow-x: hidden;
    }

    /* ─── ANIMATED BG GRID ─── */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,230,118,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,230,118,0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      pointer-events: none;
      z-index: 0;
      opacity: 1;
      transition: opacity 0.35s;
    }

    [data-theme="light"] body::before {
      background-image:
        linear-gradient(rgba(0,166,81,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,166,81,0.04) 1px, transparent 1px);
    }

    /* ─── NAVBAR ─── */
    nav {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 2rem;
      height: var(--nav-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: background 0.35s, border-color 0.35s;
    }

    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.2rem;
      font-weight: 900;
      cursor: pointer;
      user-select: none;
    }

    .nav-brand .logo-icon {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--green), var(--green-dim));
      display: flex; align-items: center; justify-content: center;
      color: #000;
      font-size: 1rem;
      box-shadow: 0 4px 16px var(--green-glow);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .nav-brand:hover .logo-icon {
      transform: rotate(-8deg) scale(1.05);
    }

    .nav-actions { display: flex; gap: 8px; align-items: center; }

    /* ─── THEME TOGGLE ─── */
    .theme-toggle {
      width: 44px; height: 44px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface2);
      color: var(--text-dim);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      transition: all 0.25s;
      position: relative;
      overflow: hidden;
    }

    .theme-toggle:hover {
      border-color: var(--green);
      color: var(--green);
      background: var(--green-glow);
    }

    .theme-toggle .icon-sun,
    .theme-toggle .icon-moon {
      position: absolute;
      transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
    }

    [data-theme="light"] .theme-toggle .icon-moon { transform: translateY(30px) rotate(90deg); opacity: 0; }
    [data-theme="light"] .theme-toggle .icon-sun  { transform: translateY(0) rotate(0); opacity: 1; }
    [data-theme="dark"]  .theme-toggle .icon-sun  { transform: translateY(-30px) rotate(-90deg); opacity: 0; }
    [data-theme="dark"]  .theme-toggle .icon-moon { transform: translateY(0) rotate(0); opacity: 1; }

    /* ─── BTNS ─── */
    .btn {
      padding: 9px 18px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      cursor: pointer;
      font-family: 'Cairo', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      transition: all 0.2s;
      display: inline-flex; align-items: center; gap: 6px;
    }

    .btn-ghost {
      background: var(--surface2);
      color: var(--text-dim);
      border-color: var(--border);
    }
    .btn-ghost:hover { background: var(--surface3); color: var(--text); border-color: var(--border-hover); }

    .btn-primary {
      background: var(--green);
      color: #000;
      font-weight: 900;
    }
    .btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 6px 20px var(--green-glow); }
    .btn-primary:active { transform: translateY(0); }

    .btn-danger {
      background: rgba(255,82,82,0.1);
      color: var(--red);
      border-color: rgba(255,82,82,0.2);
    }
    .btn-danger:hover { background: rgba(255,82,82,0.2); border-color: var(--red); }

    .btn-blue {
      background: rgba(41,121,255,0.1);
      color: #6aa6ff;
      border-color: rgba(41,121,255,0.2);
    }
    .btn-blue:hover { background: rgba(41,121,255,0.2); border-color: #2979ff; }

    /* ─── MAIN ─── */
    #main {
      max-width: 860px;
      margin: 0 auto;
      padding: 2.5rem 1rem;
      position: relative;
      z-index: 1;
    }

    /* ─── FADE IN ANIMATION ─── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }

    .animate-up  { animation: fadeUp 0.45s cubic-bezier(0.22,1,0.36,1) both; }
    .animate-in  { animation: fadeIn 0.35s ease both; }
    .animate-scale { animation: scaleIn 0.35s cubic-bezier(0.22,1,0.36,1) both; }

    /* ─── HOME PAGE ─── */
    .page-title {
      text-align: center;
      font-size: 2.4rem;
      font-weight: 900;
      margin-bottom: 0.4rem;
      animation: fadeUp 0.5s ease both;
    }

    .page-title span { color: var(--green); }

    .page-sub {
      text-align: center;
      color: var(--text-dim);
      margin-bottom: 2.5rem;
      font-size: 1rem;
      animation: fadeUp 0.5s 0.1s ease both;
    }

    #quizzes-list {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.2rem;
    }

    .quiz-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.8rem;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22,1,0.36,1);
      position: relative;
      overflow: hidden;
      animation: fadeUp 0.5s ease both;
    }

    .quiz-card::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--green-glow), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .quiz-card:hover {
      border-color: var(--green);
      transform: translateY(-5px);
      box-shadow: var(--shadow), var(--shadow-green);
    }

    .quiz-card:hover::before { opacity: 1; }

    .quiz-card .q-icon {
      width: 48px; height: 48px;
      border-radius: 12px;
      background: var(--green-glow);
      border: 1px solid rgba(0,230,118,0.2);
      display: flex; align-items: center; justify-content: center;
      color: var(--green);
      font-size: 1.3rem;
      margin-bottom: 1.2rem;
      transition: transform 0.3s;
    }

    .quiz-card:hover .q-icon { transform: scale(1.1) rotate(-5deg); }

    .quiz-card h3 {
      font-size: 1.1rem;
      font-weight: 800;
      margin-bottom: 6px;
      line-height: 1.4;
    }

    .quiz-card p { color: var(--text-dim); font-size: 0.88rem; }

    .quiz-card .arrow {
      margin-top: 1.4rem;
      color: var(--green);
      font-size: 0.85rem;
      font-weight: 700;
      display: flex; align-items: center; gap: 6px;
      transition: gap 0.2s;
    }

    .quiz-card:hover .arrow { gap: 10px; }

    /* ─── LOADING ─── */
    .loading {
      text-align: center;
      padding: 5rem;
      color: var(--text-dim);
    }

    .spinner {
      width: 44px; height: 44px;
      border: 3px solid var(--border);
      border-top-color: var(--green);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1rem;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── QUIZ PAGE ─── */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      animation: fadeUp 0.4s ease both;
    }

    .quiz-header-title {
      font-size: 1rem;
      font-weight: 800;
      color: var(--green);
    }

    .progress-bar-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 100px;
      height: 6px;
      margin-bottom: 1.5rem;
      overflow: hidden;
      animation: fadeIn 0.4s ease both;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--green-dim), var(--green));
      border-radius: 100px;
      transition: width 0.5s cubic-bezier(0.22,1,0.36,1);
    }

    .progress-pill {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 700;
    }

    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2.5rem;
      animation: scaleIn 0.4s cubic-bezier(0.22,1,0.36,1) both;
      box-shadow: var(--shadow);
    }

    .question-num {
      font-size: 0.78rem;
      color: var(--green);
      font-weight: 800;
      margin-bottom: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .question-text {
      font-size: 1.25rem;
      font-weight: 700;
      line-height: 1.75;
      margin-bottom: 2rem;
    }

    .options-grid { display: flex; flex-direction: column; gap: 10px; }

    .option {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 1rem 1.4rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.22,1,0.36,1);
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.97rem;
      font-weight: 600;
      animation: fadeUp 0.35s ease both;
    }

    .option:nth-child(1) { animation-delay: 0.05s; }
    .option:nth-child(2) { animation-delay: 0.1s; }
    .option:nth-child(3) { animation-delay: 0.15s; }
    .option:nth-child(4) { animation-delay: 0.2s; }

    .option:hover {
      border-color: var(--green);
      background: var(--green-glow);
      transform: translateX(-4px);
    }

    .option.selected {
      border-color: var(--green);
      background: var(--green-glow);
    }

    .option.correct {
      border-color: var(--green) !important;
      background: rgba(0,230,118,0.12) !important;
    }

    .option.wrong {
      border-color: var(--red) !important;
      background: rgba(255,82,82,0.12) !important;
    }

    .option-letter {
      width: 34px; height: 34px;
      border-radius: 9px;
      background: var(--surface3);
      display: flex; align-items: center; justify-content: center;
      font-weight: 900;
      font-size: 0.82rem;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .selected .option-letter { background: var(--green); color: #000; }
    .correct .option-letter  { background: var(--green); color: #000; }
    .wrong .option-letter    { background: var(--red); color: #fff; }

    .tf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

    .tf-option {
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      padding: 2rem;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.22,1,0.36,1);
    }

    .tf-option:hover { border-color: var(--green); background: var(--green-glow); transform: scale(1.03); }
    .tf-option.selected { border-color: var(--green); background: var(--green-glow); }
    .tf-option.correct  { border-color: var(--green) !important; background: rgba(0,230,118,0.12) !important; }
    .tf-option.wrong    { border-color: var(--red)   !important; background: rgba(255,82,82,0.12) !important; }

    textarea {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 14px;
      padding: 1.2rem;
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      font-size: 1rem;
      resize: none;
      transition: border-color 0.2s;
      outline: none;
    }

    textarea:focus { border-color: var(--green); }

    .explanation {
      margin-top: 1.5rem;
      background: rgba(0,230,118,0.06);
      border: 1px solid rgba(0,230,118,0.18);
      border-radius: 12px;
      padding: 1.2rem 1.5rem;
      color: var(--text);
      font-size: 0.93rem;
      line-height: 1.7;
      animation: fadeUp 0.4s ease both;
    }

    .explanation strong { color: var(--green); }

    .quiz-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1.5rem;
      animation: fadeUp 0.4s 0.2s ease both;
    }

    /* ─── RESULTS ─── */
    .results-title {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 900;
      margin-bottom: 0.4rem;
      animation: fadeUp 0.5s ease both;
    }

    .results-sub {
      text-align: center;
      color: var(--text-dim);
      margin-bottom: 2rem;
      animation: fadeUp 0.5s 0.1s ease both;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.5rem;
      text-align: center;
      transition: transform 0.25s;
      animation: fadeUp 0.5s ease both;
    }

    .stat-card:hover { transform: translateY(-3px); }

    .stat-num { font-size: 3rem; font-weight: 900; }
    .stat-label { color: var(--text-dim); font-size: 0.88rem; margin-top: 4px; }

    .score-display {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3rem;
      text-align: center;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
      animation: scaleIn 0.5s 0.2s ease both;
    }

    .score-display::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 100%, var(--green-glow), transparent 70%);
      pointer-events: none;
    }

    .score-pct { font-size: 5rem; font-weight: 900; }
    .score-frac { font-size: 1.4rem; color: var(--text-dim); margin-top: 6px; }

    .results-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      animation: fadeUp 0.5s 0.3s ease both;
    }

    /* ─── ADMIN ─── */
    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      animation: fadeUp 0.4s ease both;
    }

    .admin-quiz-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.4rem 1.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      transition: all 0.25s;
      animation: fadeUp 0.4s ease both;
    }

    .admin-quiz-card:hover {
      border-color: var(--border-hover);
      transform: translateX(-3px);
    }

    .admin-quiz-card h4 { font-size: 1rem; font-weight: 800; }
    .admin-quiz-card p  { color: var(--text-dim); font-size: 0.85rem; margin-top: 4px; }

    .admin-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    /* ─── SELECTION MODE ─── */
    .admin-quiz-card.selected-card {
      border-color: var(--green) !important;
      background: var(--green-glow) !important;
    }

    .quiz-checkbox {
      width: 22px; height: 22px;
      border-radius: 7px;
      border: 2px solid var(--text-muted);
      background: var(--surface2);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s cubic-bezier(0.22,1,0.36,1);
      margin-left: 4px;
    }

    .quiz-checkbox.checked {
      background: var(--green);
      border-color: var(--green);
      box-shadow: 0 0 10px var(--green-glow);
      transform: scale(1.1);
    }

    .quiz-checkbox.checked::after {
      content: '';
      width: 6px; height: 10px;
      border: 2px solid #000;
      border-top: none; border-right: none;
      transform: rotate(-45deg) translate(1px, -1px);
      display: block;
    }

    /* ─── BULK ACTION BAR ─── */
    #bulk-bar {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 300;
      transition: transform 0.4s cubic-bezier(0.22,1,0.36,1), box-shadow 0.3s;
      box-shadow: var(--shadow);
      white-space: nowrap;
      backdrop-filter: blur(12px);
    }

    #bulk-bar.visible {
      transform: translateX(-50%) translateY(0);
      box-shadow: var(--shadow), 0 0 40px rgba(255,82,82,0.15);
    }

    .bulk-count {
      background: var(--green);
      color: #000;
      font-weight: 900;
      font-size: 0.88rem;
      padding: 4px 12px;
      border-radius: 20px;
      min-width: 28px;
      text-align: center;
    }

    .bulk-label {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-dim);
    }

    .btn-select-mode {
      background: var(--surface2);
      color: var(--text-dim);
      border-color: var(--border);
    }
    .btn-select-mode.active {
      background: rgba(0,230,118,0.1);
      color: var(--green);
      border-color: rgba(0,230,118,0.3);
    }

    /* ─── PASSWORD MODAL ─── */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
      padding: 1rem;
      animation: fadeIn 0.25s ease both;
    }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.5rem;
      width: 100%;
      max-width: 420px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow);
      animation: scaleIn 0.3s cubic-bezier(0.22,1,0.36,1) both;
      position: relative;
    }

    /* Password Modal Specific */
    .pwd-modal {
      max-width: 380px;
      text-align: center;
    }

    .pwd-icon-wrap {
      width: 72px; height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(0,230,118,0.15), rgba(0,230,118,0.05));
      border: 1px solid rgba(0,230,118,0.25);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.5rem;
      font-size: 2rem;
      color: var(--green);
      animation: fadeUp 0.4s 0.1s ease both;
    }

    .pwd-title {
      font-size: 1.4rem;
      font-weight: 900;
      margin-bottom: 0.4rem;
      animation: fadeUp 0.4s 0.15s ease both;
    }

    .pwd-sub {
      font-size: 0.88rem;
      color: var(--text-dim);
      margin-bottom: 2rem;
      animation: fadeUp 0.4s 0.2s ease both;
    }

    .pwd-input-wrap {
      position: relative;
      margin-bottom: 1.2rem;
      animation: fadeUp 0.4s 0.25s ease both;
    }

    .pwd-input {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 14px 50px 14px 18px;
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      font-size: 1.05rem;
      font-weight: 700;
      letter-spacing: 3px;
      text-align: center;
      outline: none;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    .pwd-input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px var(--green-glow);
    }

    .pwd-input.error {
      border-color: var(--red) !important;
      box-shadow: 0 0 0 3px rgba(255,82,82,0.15) !important;
      animation: shake 0.4s ease;
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }
      60% { transform: translateX(-5px); }
      80% { transform: translateX(5px); }
    }

    .pwd-toggle {
      position: absolute;
      left: 14px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none; cursor: pointer;
      color: var(--text-dim);
      font-size: 1.1rem;
      padding: 4px;
      transition: color 0.2s;
    }

    .pwd-toggle:hover { color: var(--green); }

    .pwd-error {
      font-size: 0.85rem;
      color: var(--red);
      margin-bottom: 1rem;
      height: 18px;
      transition: opacity 0.2s;
      animation: fadeUp 0.3s ease both;
    }

    .pwd-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      background: var(--green);
      color: #000;
      font-family: 'Cairo', sans-serif;
      font-weight: 900;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      animation: fadeUp 0.4s 0.3s ease both;
    }

    .pwd-btn:hover { filter: brightness(1.1); transform: translateY(-1px); box-shadow: 0 8px 24px var(--green-glow); }
    .pwd-btn:active { transform: translateY(0); }

    .pwd-dots {
      display: flex; gap: 8px; justify-content: center;
      margin-bottom: 1.5rem;
      animation: fadeUp 0.4s 0.22s ease both;
    }

    .pwd-dot {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: var(--border);
      border: 1.5px solid var(--text-muted);
      transition: all 0.2s;
    }

    .pwd-dot.filled {
      background: var(--green);
      border-color: var(--green);
      box-shadow: 0 0 8px var(--green-glow);
      transform: scale(1.15);
    }

    /* ─── REGULAR MODAL ─── */
    .modal-lg {
      max-width: 600px;
    }

    .modal h3 {
      font-size: 1.3rem;
      font-weight: 900;
      margin-bottom: 1.5rem;
    }

    .form-group { margin-bottom: 1.1rem; }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-dim);
      margin-bottom: 6px;
      font-weight: 700;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 14px;
      color: var(--text);
      font-family: 'Cairo', sans-serif;
      font-size: 0.93rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus { border-color: var(--green); }

    .form-group select option { background: var(--surface2); color: var(--text); }

    .modal-actions {
      display: flex; gap: 10px;
      justify-content: flex-end;
      margin-top: 1.5rem;
    }

    .hidden { display: none !important; }

    /* ─── CUSTOM CONFIRM DIALOG ─── */
    #confirm-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 500;
      padding: 1rem;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    #confirm-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    #confirm-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 2.2rem 2rem 1.8rem;
      width: 100%;
      max-width: 360px;
      text-align: center;
      box-shadow: var(--shadow);
      transform: scale(0.88) translateY(16px);
      transition: transform 0.3s cubic-bezier(0.22,1,0.36,1);
      position: relative;
    }

    #confirm-overlay.open #confirm-box {
      transform: scale(1) translateY(0);
    }

    .confirm-icon-wrap {
      width: 64px; height: 64px;
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 1.3rem;
      font-size: 1.8rem;
    }

    .confirm-icon-wrap.danger {
      background: rgba(255,82,82,0.12);
      border: 1px solid rgba(255,82,82,0.2);
      color: var(--red);
    }

    .confirm-icon-wrap.warning {
      background: rgba(255,171,64,0.12);
      border: 1px solid rgba(255,171,64,0.2);
      color: var(--amber);
    }

    #confirm-title {
      font-size: 1.15rem;
      font-weight: 900;
      margin-bottom: 0.5rem;
      line-height: 1.4;
    }

    #confirm-msg {
      font-size: 0.88rem;
      color: var(--text-dim);
      line-height: 1.6;
      margin-bottom: 1.8rem;
    }

    .confirm-btns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .confirm-btns button {
      padding: 12px;
      border-radius: 12px;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .confirm-btns .confirm-yes {
      background: var(--red);
      color: #fff;
      font-weight: 900;
    }

    .confirm-btns .confirm-no {
      background: var(--surface2);
      color: var(--text);
      border-color: var(--border);
      font-weight: 700;
    }

    .confirm-btns .confirm-yes:hover { filter: brightness(1.15); }
    .confirm-btns .confirm-no:hover { background: var(--surface3); }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 640px) {
      .stats-grid { grid-template-columns: 1fr; }
      .quiz-card { padding: 1.4rem; }
      .page-title { font-size: 1.8rem; }
      .score-pct { font-size: 3.5rem; }
    }
  </style>
</head>
<body>
  <!-- Navbar -->
  <nav>
    <div class="nav-brand" onclick="goHome()">
      <div class="logo-icon">🏥</div>
      <span>امتحانات الدفعة</span>
    </div>
    <div class="nav-actions">
      <button class="theme-toggle" onclick="toggleTheme()">
        <i class="icon-sun fas fa-sun"></i>
        <i class="icon-moon fas fa-moon"></i>
      </button>
      <button class="btn btn-blue" onclick="promptAdminPassword()" id="admin-btn">
        <i class="fas fa-lock"></i>
        <span>Admin</span>
      </button>
    </div>
  </nav>

  <!-- Main Content -->
  <div id="main"></div>

  <!-- Password Modal -->
  <div class="modal-overlay hidden" id="password-modal">
    <div class="modal pwd-modal">
      <div class="pwd-icon-wrap">🔐</div>
      <h2 class="pwd-title">Admin Access</h2>
      <p class="pwd-sub">Enter the admin password to continue</p>
      
      <div class="pwd-input-wrap">
        <input type="password" class="pwd-input" id="pwd-input" placeholder="••••••••" onkeyup="updatePwdDots()">
        <button class="pwd-toggle" onclick="togglePwdVisibility()">
          <i class="fas fa-eye"></i>
        </button>
      </div>

      <div class="pwd-dots" id="pwd-dots">
        <div class="pwd-dot"></div>
        <div class="pwd-dot"></div>
        <div class="pwd-dot"></div>
        <div class="pwd-dot"></div>
        <div class="pwd-dot"></div>
        <div class="pwd-dot"></div>
      </div>

      <div class="pwd-error" id="pwd-error"></div>

      <button class="pwd-btn" onclick="checkPassword()">
        <i class="fas fa-lock-open"></i>
        <span>Unlock Admin</span>
      </button>
    </div>
  </div>

  <!-- Confirm Dialog -->
  <div id="confirm-overlay">
    <div id="confirm-box">
      <div class="confirm-icon-wrap"></div>
      <h3 id="confirm-title"></h3>
      <p id="confirm-msg"></p>
      <div class="confirm-btns">
        <button class="confirm-no" onclick="cancelConfirm()">Cancel</button>
        <button class="confirm-yes" onclick="acceptConfirm()">Delete</button>
      </div>
    </div>
  </div>

  <script>
    // ========== CONFIG ==========
    const CORRECT_PASSWORD = 'samir123';
    const ADMIN_KEY = 'admin_access_granted';

    // ========== STATE ==========
    let quizzes = [];
    let currentPage = 'home';
    let currentQuizId = null;
    let currentQuestionIndex = 0;
    let userAnswers = {};
    let isAdmin = localStorage.getItem(ADMIN_KEY) === 'true';

    // ========== PASSWORD ==========
    function promptAdminPassword() {
      document.getElementById('password-modal').classList.remove('hidden');
      document.getElementById('pwd-input').focus();
      document.getElementById('pwd-error').textContent = '';
    }

    function checkPassword() {
      const pwd = document.getElementById('pwd-input').value;
      const errorEl = document.getElementById('pwd-error');
      
      if (pwd === CORRECT_PASSWORD) {
        localStorage.setItem(ADMIN_KEY, 'true');
        isAdmin = true;
        document.getElementById('password-modal').classList.add('hidden');
        document.getElementById('pwd-input').value = '';
        showAdminPanel();
      } else {
        errorEl.textContent = '❌ Incorrect password';
        document.getElementById('pwd-input').classList.add('error');
        setTimeout(() => {
          document.getElementById('pwd-input').classList.remove('error');
        }, 400);
      }
    }

    function updatePwdDots() {
      const len = document.getElementById('pwd-input').value.length;
      const dots = document.querySelectorAll('.pwd-dot');
      dots.forEach((dot, i) => {
        if (i < len) dot.classList.add('filled');
        else dot.classList.remove('filled');
      });
    }

    function togglePwdVisibility() {
      const input = document.getElementById('pwd-input');
      const toggle = document.querySelector('.pwd-toggle');
      if (input.type === 'password') {
        input.type = 'text';
        toggle.innerHTML = '<i class="fas fa-eye-slash"></i>';
      } else {
        input.type = 'password';
        toggle.innerHTML = '<i class="fas fa-eye"></i>';
      }
    }

    // ========== THEME ==========
    function toggleTheme() {
      const html = document.documentElement;
      const current = html.getAttribute('data-theme') || 'dark';
      const next = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }

    // ========== NAV ==========
    function goHome() {
      currentPage = 'home';
      render();
    }

    // ========== RENDER ==========
    function render() {
      const main = document.getElementById('main');
      
      if (currentPage === 'home') {
        renderHome();
      } else if (currentPage === 'quiz') {
        renderQuiz();
      } else if (currentPage === 'results') {
        renderResults();
      } else if (currentPage === 'admin') {
        renderAdmin();
      }
    }

    function renderHome() {
      const main = document.getElementById('main');
      main.innerHTML = `
        <h1 class="page-title">امتحانات <span>الدفعة</span></h1>
        <p class="page-sub">كلية الطب - جامعة قنا الأهلية</p>
        <div id="quizzes-list"></div>
      `;
      
      loadQuizzes();
    }

    function loadQuizzes() {
      // Placeholder data
      quizzes = [
        {
          id: 1,
          name: 'Anatomy Quiz',
          questions: 10,
          type: 'multiple',
          icon: '🧬'
        },
        {
          id: 2,
          name: 'Physiology',
          questions: 8,
          type: 'trueFalse',
          icon: '💗'
        },
        {
          id: 3,
          name: 'Pharmacology',
          questions: 12,
          type: 'essay',
          icon: '💊'
        }
      ];

      const list = document.getElementById('quizzes-list');
      list.innerHTML = quizzes.map(quiz => `
        <div class="quiz-card" onclick="startQuiz(${quiz.id})">
          <div class="q-icon">${quiz.icon}</div>
          <h3>${quiz.name}</h3>
          <p>${quiz.questions} أسئلة</p>
          <div class="arrow">
            <span>ابدأ الآن</span>
            <i class="fas fa-arrow-left"></i>
          </div>
        </div>
      `).join('');
    }

    function startQuiz(id) {
      currentQuizId = id;
      currentPage = 'quiz';
      currentQuestionIndex = 0;
      userAnswers = {};
      render();
    }

    function renderQuiz() {
      const quiz = quizzes.find(q => q.id === currentQuizId);
      if (!quiz) return;

      const main = document.getElementById('main');
      const progress = ((currentQuestionIndex + 1) / 10) * 100;

      main.innerHTML = `
        <div class="quiz-header">
          <h2 class="quiz-header-title">${quiz.name}</h2>
          <div class="progress-pill">${currentQuestionIndex + 1} / 10</div>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" style="width: ${progress}%"></div>
        </div>
        <div class="question-card">
          <div class="question-num">Question ${currentQuestionIndex + 1}</div>
          <div class="question-text">What is the correct answer?</div>
          <div class="options-grid">
            <div class="option" onclick="selectAnswer('a')">
              <div class="option-letter">A</div>
              <div>Option A</div>
            </div>
            <div class="option" onclick="selectAnswer('b')">
              <div class="option-letter">B</div>
              <div>Option B</div>
            </div>
            <div class="option" onclick="selectAnswer('c')">
              <div class="option-letter">C</div>
              <div>Option C</div>
            </div>
            <div class="option" onclick="selectAnswer('d')">
              <div class="option-letter">D</div>
              <div>Option D</div>
            </div>
          </div>
          <div class="quiz-actions">
            <button class="btn btn-ghost" onclick="goHome()">Back</button>
            <button class="btn btn-primary" onclick="nextQuestion()">Next</button>
          </div>
        </div>
      `;
    }

    function selectAnswer(answer) {
      userAnswers[currentQuestionIndex] = answer;
    }

    function nextQuestion() {
      if (currentQuestionIndex < 9) {
        currentQuestionIndex++;
        renderQuiz();
      } else {
        currentPage = 'results';
        render();
      }
    }

    function renderResults() {
      const correctCount = Object.keys(userAnswers).length;
      const percentage = Math.round((correctCount / 10) * 100);

      const main = document.getElementById('main');
      main.innerHTML = `
        <h1 class="results-title">تم <span>الانتهاء</span></h1>
        <p class="results-sub">تحقق من نتائجك</p>
        
        <div class="score-display">
          <div class="score-pct">${percentage}%</div>
          <div class="score-frac">${correctCount} / 10</div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-num">${correctCount}</div>
            <div class="stat-label">Correct</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">${10 - correctCount}</div>
            <div class="stat-label">Wrong</div>
          </div>
          <div class="stat-card">
            <div class="stat-num">${percentage}%</div>
            <div class="stat-label">Score</div>
          </div>
        </div>

        <div class="results-actions">
          <button class="btn btn-ghost" onclick="goHome()">Home</button>
          <button class="btn btn-primary" onclick="startQuiz(${currentQuizId})">Retry</button>
        </div>
      `;
    }

    function showAdminPanel() {
      currentPage = 'admin';
      render();
    }

    function renderAdmin() {
      const main = document.getElementById('main');
      main.innerHTML = `
        <div class="admin-header">
          <h1 class="page-title">Admin <span>Panel</span></h1>
          <button class="btn btn-danger" onclick="logoutAdmin()">
            <i class="fas fa-sign-out-alt"></i>
            Logout
          </button>
        </div>
        
        <div class="admin-quiz-card">
          <div>
            <h4>Manage Quizzes</h4>
            <p>Edit, delete, or create new quizzes</p>
          </div>
          <div class="admin-actions">
            <button class="btn btn-primary">Edit</button>
          </div>
        </div>

        <div class="admin-quiz-card">
          <div>
            <h4>View Results</h4>
            <p>Check student scores and analytics</p>
          </div>
          <div class="admin-actions">
            <button class="btn btn-primary">View</button>
          </div>
        </div>

        <div class="admin-quiz-card">
          <div>
            <h4>Settings</h4>
            <p>Configure application settings</p>
          </div>
          <div class="admin-actions">
            <button class="btn btn-primary">Configure</button>
          </div>
        </div>
      `;
    }

    function logoutAdmin() {
      localStorage.removeItem(ADMIN_KEY);
      isAdmin = false;
      goHome();
    }

    // ========== CONFIRM ==========
    function showConfirm(title, msg, onYes) {
      document.getElementById('confirm-title').textContent = title;
      document.getElementById('confirm-msg').textContent = msg;
      document.getElementById('confirm-overlay').classList.add('open');
      window.confirmCallback = onYes;
    }

    function acceptConfirm() {
      if (window.confirmCallback) window.confirmCallback();
      cancelConfirm();
    }

    function cancelConfirm() {
      document.getElementById('confirm-overlay').classList.remove('open');
    }

    // ========== INIT ==========
    document.addEventListener('DOMContentLoaded', () => {
      const theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
      render();
    });

    // Press Enter to submit password
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !document.getElementById('password-modal').classList.contains('hidden')) {
        checkPassword();
      }
    });
  </script>
</body>
</html>
